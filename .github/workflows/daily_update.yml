name: 每日財金知識庫自動更新 (Daily Financial Update)

on:
  schedule:
    - cron: '0 1 * * *' # 台灣時間每天早上 09:00 (UTC 01:00)
  workflow_dispatch: # 支援手動觸發按鈕

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write # 賦予 GitHub Actions 寫入與 Push 權限

    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai

      - name: 執行 AI 自動生成腳本
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/daily_update.py

      - name: 自動 Commit 並 Push 更新回 GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff-index --quiet HEAD || git commit -m "auto: 🤖 AI 自動更新每日報告"
          git push
